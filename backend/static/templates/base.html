<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1220">
  <title>{{ page_title }} · AeroTrack Transit</title>
  <!-- The dashboard uses its local no-build stylesheet. Avoiding a runtime
       Tailwind CDN request makes first paint immediate on demo networks. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v='3') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="/" aria-label="AeroTrack home">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 17h14M7 14l2.1-7h5.8L17 14M9 10h6M8 17v2m8-2v2"/></svg></span>
      <span><strong>AeroTrack</strong><small>TRANSIT CONTROL</small></span>
    </a>
    <nav aria-label="Primary navigation">
      <a class="nav-link {% if active_page == 'map' %}active{% endif %}" href="/">
        <svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Zm6-3v15m6-12v15"/></svg><span>Live map</span>
      </a>
      <a class="nav-link {% if active_page == 'stops' %}active{% endif %}" href="/stops">
        <svg viewBox="0 0 24 24"><path d="M6 21V5a2 2 0 0 1 2-2h8v18M6 8h12M9 12h6m-6 4h6M4 21h16"/></svg><span>Stops</span>
      </a>
      <a class="nav-link {% if active_page == 'buses' %}active{% endif %}" href="/buses">
        <svg viewBox="0 0 24 24"><path d="M5 16V6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v10M5 10h14M7 19h10M8 16h.01M16 16h.01M7 19v2m10-2v2"/></svg><span>Buses</span>
      </a>
      <a class="nav-link {% if active_page == 'admin' %}active{% endif %}" href="/admin">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.95 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.58 15 1.7 1.7 0 0 0 3 14H3v-4h.08A1.7 1.7 0 0 0 4.6 8.95a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.58 1.7 1.7 0 0 0 10 3V3h4v.08a1.7 1.7 0 0 0 1.03 1.5 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.42 9 1.7 1.7 0 0 0 21 10v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg><span>Admin</span>
      </a>
    </nav>
    <div class="sidebar-foot"><span class="hardware-dot"></span><div><strong>3-node network</strong><small>Prototype deployment</small></div></div>
  </aside>

  <div class="app-shell">
    <header class="topbar">
      <button class="menu-button" id="menu-button" aria-label="Toggle navigation"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div><span class="eyebrow">ACTIVE ROUTE</span><h1>{{ route_name }}</h1></div>
      <div class="connection-pill unknown" id="connection-pill"><span></span><b>Awaiting data</b></div>
    </header>
    <main class="main-content">{% block content %}{% endblock %}</main>
  </div>
  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/common.js', v='2') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
