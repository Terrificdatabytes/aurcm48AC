{% extends 'base.html' %}
{% block content %}

<div id="buses-grid" class="card-grid"><div class="skeleton-card"></div></div>

{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/buses.js') }}" defer></script>{% endblock %}
